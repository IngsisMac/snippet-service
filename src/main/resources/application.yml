server:
  port: 8080
  error:
    # La UI muestra `message` del JSON de error (razon de ResponseStatusException); por defecto Spring lo omite.
    include-message: always

spring:
  application:
    name: snippet-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/snippets_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI:https://dev-o02i7bmya113pn5u.us.auth0.com/}
          audiences: ${AUTH0_AUDIENCE:https://snippet-searcher.ingsis/}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

services:
  runner:
    url: ${RUNNER_SERVICE_URL:http://localhost:8082}
    connect-timeout: ${RUNNER_CONNECT_TIMEOUT:2s}
    read-timeout: ${RUNNER_READ_TIMEOUT:5s}
  permission:
    url: ${PERMISSION_SERVICE_URL:http://localhost:8081}
    connect-timeout: ${PERMISSION_CONNECT_TIMEOUT:2s}
    read-timeout: ${PERMISSION_READ_TIMEOUT:3s}
  asset:
    url: ${ASSET_SERVICE_URL:http://localhost:8083}
    connect-timeout: ${ASSET_CONNECT_TIMEOUT:2s}
    read-timeout: ${ASSET_READ_TIMEOUT:3s}

snippet:
  store:
    type: ${SNIPPET_STORE_TYPE:asset-service}

auth:
  m2m:
    enabled: ${AUTH0_M2M_ENABLED:false}
    token-uri: ${AUTH0_M2M_TOKEN_URI:https://dev-o02i7bmya113pn5u.us.auth0.com/oauth/token}
    client-id: ${AUTH0_M2M_CLIENT_ID:}
    client-secret: ${AUTH0_M2M_CLIENT_SECRET:}
    audience: ${AUTH0_AUDIENCE:https://snippet-searcher.ingsis/}
